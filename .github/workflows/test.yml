name: Test

# Checks every push to the same branches the Pages deploy publishes
# (deploy-pages.yml is unchanged): unit tests, types, lint, the static
# build, then the browser tests against it — the smoke run and the
# Playwright suite (e2e/).
on:
  push:
    branches: [main, claude/tshirt-discovery-mvp-pc6mk9]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Anything that loads next.config.mjs on Actions (lint, build) must name
      # a public origin, or the config stops the run.
      NEXT_PUBLIC_SITE_ORIGIN: https://example.invalid
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint

      - name: Build static site
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - run: npm run smoke
      - run: npm run e2e
        env:
          CI: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
