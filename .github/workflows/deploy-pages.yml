name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/tshirt-discovery-mvp-pc6mk9]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - run: npm ci
      - run: npm test

      # Link-preview images (1200×630 PNG per tee) for WhatsApp / Facebook /
      # X / iMessage. Rendered here rather than committed (~77 MB).
      - name: Generate link-preview images
        run: npm run og
        env:
          OG_HOST: ${{ steps.pages.outputs.host }}${{ steps.pages.outputs.base_path }}

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Absolute URLs for Open Graph tags.
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          NEXT_TELEMETRY_DISABLED: 1

      # Stop GitHub Pages' Jekyll from hiding the _next/ folder.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
