<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400"><rect width="300" height="400" fill="#FFFFFF"/><rect x="32" y="32" width="236" height="336" fill="none" stroke="#000000" stroke-width="1"/><text x="46" y="134" font-size="130" font-family="Georgia, 'Times New Roman', serif" fill="#000000">“</text><text x="54" y="173.3" font-size="22.4" font-weight="400" font-style="italic" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" fill="#000000">Not all who</text><text x="54" y="200.2" font-size="22.4" font-weight="400" font-style="italic" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" fill="#000000">wander are</text><text x="54" y="227.1" font-size="22.4" font-weight="400" font-style="italic" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" fill="#000000">lost. Some are</text><text x="54" y="254" font-size="22.4" font-weight="400" font-style="italic" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" fill="#000000">looking for</text><text x="54" y="280.9" font-size="22.4" font-weight="400" font-style="italic" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" fill="#000000">their keys.</text><line x1="54" y1="296.5" x2="94" y2="296.5" stroke="#000000" stroke-width="1.5"/><text x="54" y="316.5" font-size="12" font-weight="400" text-anchor="start" font-family="'Courier New', Courier, monospace" fill="#000000">— Your future self</text></svg>