 fill="#FFFFFF" font-size="9.375" font-family="DejaVu Sans Mono, monospace" text-anchor="start">terminate</text><text x="88.1" y="200" fill="#FFFFFF" font-size="9.375" font-family="DejaVu Sans Mono, monospace" text-anchor="start">10</text><text x="110.6" y="200" fill="#FFFFFF" font-size="9.375" font-family="DejaVu Sans Mono, monospace" text-anchor="start">SIGUSR1</text><text x="161.3" y="200" fill="#FFFFFF" font-size="9.375" font-family="DejaVu Sans Mono, monospace" text-anchor="start">terminate</text><text x="88.1" y="215" fill="#FFFFFF" font-size="9.375" font-family="DejaVu Sans Mono, monospace" text-anchor="start">11</text><text x="110.6" y="215" fill="#FFFFFF" font-size="9.375" font-family="DejaVu Sans Mono, monospace" text-anchor="start">SIGSEGV</text><text x="161.3" y="215" fill="#FFFFFF" font-size="9.375" font-family="DejaVu Sans Mono, monospace" text-anchor="start">core dump</text><text x="88.1" y="230" fill="#FFFFFF" font-size="9.375" font-family="DejaVu Sans Mono, monospace" text-anchor="start">12</text><text x="110.6" y="230" fill="#FFFFFF" font-size="9.375" font-family="DejaVu Sans Mono, monospace" text-anchor="start">SIGUSR2</text><text x="161.3" y="230" fill="#FFFFFF" font-size="9.375" font-family="DejaVu Sans Mono, monospace" text-anchor="start">terminate</text><text x="88.1" y="245" fill="#FFFFFF" font-size="9.375" font-family="DejaVu Sans Mono, monospace" text-anchor="start">13</text><text x="110.6" y="245" fill="#FFFFFF" font-size="9.375" font-family="DejaVu Sans Mono, monospace" text-anchor="start">SIGPIPE</text><text x="161.3" y="245" fill="#FFFFFF" font-size="9.375" font-family="DejaVu Sans Mono, monospace" text-anchor="start">terminate</text><text x="88.1" y="260" fill="#FFFFFF" font-size="9.375" font-family="DejaVu Sans Mono, monospace" text-anchor="start">14</text><text x="110.6" y="260" fill="#FFFFFF" font-size="9.375" font-family="DejaVu Sans Mono, monospace" text-anchor="start">SIGALRM</text><text x="161.3" y="260" fill="#FFFFFF" font-size="9.375" font-family="DejaVu Sans Mono, monospace" text-anchor="start">terminate</text><text x="88.1" y="275" fill="#FFFFFF" font-size="9.375" font-family="DejaVu Sans Mono, monospace" text-anchor="start">15</text><text x="110.6" y="275" fill="#FFFFFF" font-size="9.375" font-family="DejaVu Sans Mono, monospace" text-anchor="start">SIGTERM</text><text x="161.3" y="275" fill="#FFFFFF" font-size="9.375" font-family="DejaVu Sans Mono, monospace" text-anchor="start">terminate</text><text x="150" y="330" fill="#FFFFFF" font-size="12" font-family="DejaVu Sans Mono, monospace" text-anchor="middle" font-weight="bold" letter-spacing="2.5">UNIX SIGNALS</text><text x="150" y="345" fill="#FFFFFF" font-size="8" font-family="DejaVu Sans Mono, monospace" text-anchor="middle">Linux numbering, 1 to 15</text></svg>