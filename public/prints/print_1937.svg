<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400"><rect width="300" height="400" fill="#FFFFFF"/><text x="46" y="134" font-size="130" font-family="Georgia, 'Times New Roman', serif" fill="#000000">“</text><text x="54" y="177.3" font-size="26.7" font-weight="400" font-style="italic" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" fill="#000000">The shortest</text><text x="54" y="209.3" font-size="26.7" font-weight="400" font-style="italic" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" fill="#000000">distance</text><text x="54" y="241.3" font-size="26.7" font-weight="400" font-style="italic" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" fill="#000000">between two</text><text x="54" y="273.3" font-size="26.7" font-weight="400" font-style="italic" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" fill="#000000">ideas is a</text><text x="54" y="305.3" font-size="26.7" font-weight="400" font-style="italic" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" fill="#000000">nap.</text><line x1="54" y1="322" x2="94" y2="322" stroke="#000000" stroke-width="1.5"/><text x="54" y="342" font-size="12" font-weight="400" text-anchor="start" font-family="'Courier New', Courier, monospace" fill="#000000">— Overheard in a café</text></svg>