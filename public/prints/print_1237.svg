<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400"><rect width="300" height="400" fill="#000000"/><rect x="12" y="12" width="276" height="376" fill="#FFFFFF"/><text x="46" y="134" font-size="130" font-family="Georgia, 'Times New Roman', serif" fill="#000000">“</text><text x="54" y="177.1" font-size="26.5" font-weight="400" font-style="italic" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" fill="#000000">Gravity</text><text x="54" y="208.9" font-size="26.5" font-weight="400" font-style="italic" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" fill="#000000">keeps you</text><text x="54" y="240.6" font-size="26.5" font-weight="400" font-style="italic" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" fill="#000000">grounded.</text><text x="54" y="272.4" font-size="26.5" font-weight="400" font-style="italic" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" fill="#000000">Coffee keeps</text><text x="54" y="304.1" font-size="26.5" font-weight="400" font-style="italic" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" fill="#000000">you up.</text><line x1="54" y1="320.7" x2="94" y2="320.7" stroke="#000000" stroke-width="1.5"/><text x="54" y="340.7" font-size="12" font-weight="400" text-anchor="start" font-family="'Courier New', Courier, monospace" fill="#000000">— The moon</text></svg>